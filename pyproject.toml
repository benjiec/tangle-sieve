[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve"
version = "0.1.1"
dependencies = [
  "pyarrow==20.0.0",
  "tangle @ git+https://github.com/benjiec/tangle.git@3b8c07f",
  "gimmemotifs==0.18.4",
]
description = "Untangle data"
requires-python = "==3.13"

[project.optional-dependencies]
dev = [
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sieve", "scripts"]
namespaces = true
